<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Magnolia Heights — Drive</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f14; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          Inter, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #view { display: block; width: 100vw; height: 100vh; }

      .hud { position: fixed; pointer-events: none; color: #f2f7fb; }
      #speed {
        right: 26px; bottom: 22px; text-align: right;
        text-shadow: 0 2px 8px rgba(0,0,0,.7);
      }
      #speed b { font-size: 46px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
      #speed span { font-size: 13px; opacity: .62; margin-left: 5px; }
      #street {
        left: 26px; bottom: 24px; font-size: 19px; font-weight: 600;
        text-shadow: 0 2px 8px rgba(0,0,0,.75); opacity: 0; transition: opacity .4s ease;
      }
      #street.on { opacity: 1; }
      #help {
        left: 26px; top: 22px; font-size: 12.5px; line-height: 1.7; opacity: .68;
        text-shadow: 0 1px 4px rgba(0,0,0,.8);
      }
      #help b { font-weight: 600; }
      #attrib {
        right: 22px; top: 22px; font-size: 10.5px; opacity: .42; text-align: right;
      }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
        background: radial-gradient(ellipse at 50% 45%, #16202a, #080b0f 70%);
        transition: opacity .5s ease; color: #cfdae4; text-align: center;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { font-size: 21px; font-weight: 620; letter-spacing: -.01em; }
      #boot p { margin-top: 8px; font-size: 12.5px; opacity: .55; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div class="hud" id="help">
      <b>W / ↑</b> accelerate &nbsp; <b>S / ↓</b> brake &nbsp; <b>A D / ← →</b> steer<br />
      <b>Space</b> handbrake &nbsp; <b>C</b> camera &nbsp; <b>R</b> reset to 9903
    </div>
    <div class="hud" id="attrib">Map data © OpenStreetMap contributors (ODbL)</div>
    <div class="hud" id="street"></div>
    <div class="hud" id="speed"><b>0</b><span>KM/H</span></div>

    <div id="boot">
      <div>
        <h1>Magnolia Heights</h1>
        <p id="bootmsg">Loading neighbourhood…</p>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
